name: Publish UI Packages

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish-ui-packages:
    runs-on:
      - self-hosted
      - tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@maslazu"
          cache: pnpm

      - name: Print runner tool versions
        run: |
          git --version
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI package
        run: pnpm build:ui

      - name: Build frontend kit adapter package
        run: pnpm build:frontend-kit-adapter

      - name: Typecheck docs app
        run: pnpm typecheck:docs

      - name: Typecheck frontend kit adapter package
        run: pnpm typecheck:frontend-kit-adapter

      - name: Validate release tag matches package versions
        if: github.event_name == 'release'
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          ADAPTER_VERSION=$(node -p "require('./packages/frontend-kit-adapter/package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ "v${UI_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match UI package version v${UI_VERSION}"
            exit 1
          fi
          if [ "v${ADAPTER_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match adapter package version v${ADAPTER_VERSION}"
            exit 1
          fi

      - name: Verify UI package contents
        working-directory: packages/ui
        run: pnpm publish --dry-run --no-git-checks

      - name: Verify frontend kit adapter package contents
        working-directory: packages/frontend-kit-adapter
        run: pnpm publish --dry-run --no-git-checks

      - name: Publish UI package
        working-directory: packages/ui
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish frontend kit adapter package
        working-directory: packages/frontend-kit-adapter
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
